name: Code Quality Checks

on:
  # Ejecutar en TODOS los pull requests (incluso desde feature/ghg/proyecto_tf)
  pull_request:
    branches:
      - '**'

  # Ejecutar en push a TODAS las ramas EXCEPTO feature/ghg/proyecto_tf
  push:
    branches:
      - '**'
      - '!feature/ghg/proyecto_tf'

jobs:
  pre-commit:
    name: Pre-commit Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure

  code-quality:
    name: Code Quality Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.3.0 flake8==7.0.0 isort==5.13.2 mypy==1.9.0
          pip install flake8-docstrings==1.7.0
          pip install pandas-stubs types-requests types-setuptools

      - name: Check formatting with Black (79 chars)
        run: |
          echo "📝 Checking code formatting with Black..."
          black --check --line-length=79 src/

      - name: Check imports with isort
        run: |
          echo "📦 Checking import order with isort..."
          isort --check-only --profile black --line-length=79 src/

      - name: Lint with flake8
        run: |
          echo "🔍 Linting code with flake8..."
          flake8 src/ --max-line-length=79 \
            --extend-ignore=E203,W503 --count --statistics

      - name: Type check with mypy
        continue-on-error: true
        run: |
          echo "🔬 Type checking with mypy..."
          mypy src/ --ignore-missing-imports --no-strict-optional

      - name: Summary
        if: always()
        run: |
          echo "## ✅ Code Quality Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation tools have been executed." >> $GITHUB_STEP_SUMMARY
          echo "Please review any failures above." >> $GITHUB_STEP_SUMMARY
